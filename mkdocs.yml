site_name: Jarvis-HEP Documentation
site_url: https://pengxuan-zhu-phys.github.io/Jarvis-Docs/

theme:
  name: material
  logo: assets/JarvisHEP.png
  favicon: assets/JarvisHEP.png
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Home: index.md
  - Get Start:
      - Installation: tutorial/Installation.md
      - Eggbox (Start Here): tutorial/eggbox.md
  - Documentations:
      - YAML Configuration:    
          - Main structure: core/summary.md 
          - Samplers:   core/samplers.md 
          - Libraries:  core/library.md
          - Calculators: core/calculator.md
          - EnvReqs:    core/environment.md
      - Concepts & Conventions:
          - YAML Format introduction: yaml/yaml_introduction.md
          - Symbolic Expressions: core/symbol.md
          - Utils:  core/utils.md
          - IO file type: core/io_summary.md
  - High Energy Physics Package Wikis: 
      - HEP Packages: package/summary.md 
      - Jarvis-Operas: package/jarvis-operas.md
  - Data Visulisation:
      - Jarvis-PLOT:
          - Overview: jarvisplot/jarvisplot.md
          - Quick Start: jarvisplot/quickstart.md
          - CLI: jarvisplot/cli.md
          - YAML Schema: jarvisplot/yaml-schema.md
          - DataSet: jarvisplot/dataset.md
          - Figures and Layers: jarvisplot/figures-layers.md
          - Transforms: jarvisplot/transforms.md
          - Profiling and Cache: jarvisplot/profiling-preprofiling-cache.md
          - Plot Methods: jarvisplot/methods.md
          - Rect and Ternary Axes: jarvisplot/axes-rect-ternary.md
          - Functions and Interpolators: jarvisplot/functions-interpolators.md
          - FAQ: jarvisplot/faq-troubleshooting.md
          - Gallery:
              - EggBox Dynesty: jarvisplot/pub/eggbox.md
              - GM95 Excess: jarvisplot/pub/gm95excess.md
              - HinoLLP: jarvisplot/pub/hinollp.md
              - SUSY Run2: jarvisplot/pub/susy-ewmssm.md
              - CEPC: jarvisplot/pub/cepc.md
  - Case studies: 
      - Published Works: examples/examples.md
