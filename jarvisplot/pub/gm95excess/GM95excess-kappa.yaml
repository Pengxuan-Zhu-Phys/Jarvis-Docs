- name: pAlphaMHin_ProfLogL
  enable: true
  style:
  - a4paper_2x1
  - rectcmap
  frame:
    ax:
      labels:
        y: "$\\alpha$"
        x: "$M_{H}^{\\rm In}~({\\rm GeV})$"
      ylim: [-1.57, 1.57]
      xlim: [90, 100]
    axc:
      label:
        ylabel: profile likelihood ratio $\mathcal{L}_{\kappa}/ \mathcal{L}_{\kappa}^{\rm max}$
  layers:
  - name: prof
    data:
    - source: df
      transform:
      - profile:
          bin: 100
          coordinates:
            x:
              expr: (Alpha < 90.) * (Alpha / 180. * np.pi) + (Alpha >= 90.) * ((Alpha / 180. - 1) * np.pi )
              scale: linear
              name: xx
              lim: [-1.57, 1.57]
            y:
              expr:  MHin
              scale: linear
              name: yy
              lim: [90, 100]
            z:
              expr: X2kappa
              scale: linear
              name: z0
          objective: min
          grid_points: rect
    axes: ax
    method: voronoi
    coordinates:
      x:
        expr: yy
      y:
        expr: xx
      z:
        expr: np.exp(-2.0 * (X2kappa - np.min(X2kappa)))
    style:
      cmap: jarvis_rainbow2_r
      vmin: 0
      vmax: 1

