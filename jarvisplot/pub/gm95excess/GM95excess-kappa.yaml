output:
  dir: ./Plots-26-2-20/X2kappa
  dpi: 300
  formats:
  - png
  # - pdf
project:
  name: 95@GM JarvisPLOT
  workdir: /home/ubuntu/xkdu/GM-gamma-tau/plot-26-2-5/Workshop/95@GM
version: 1.0.3

DataSet:
- name: df
  path: /home/ubuntu/xkdu/GM-gamma-tau/plot-26-2-5/full-check-results-26-2-5-to-plot.csv
  type: csv
- name: atlas_2312 
  path: /home/ubuntu/xkdu/GM-gamma-tau/plot-26-2-5/ATLAS_2312.00420.csv
  type: csv 

Figures:
- name: pL2L4_ProfLogL
  enable: true
  style:
  - a4paper_2x1
  - rectcmap
  frame:
    ax:
      labels:
        x: "$\\lambda_2$"
        y: "$\\lambda_4$"
      xlim: [-1.5, 1.5]
      ylim: [-1.5, 1.5]
    axc:
      label:
        ylabel: profile likelihood ratio $\mathcal{L}_{\kappa}/ \mathcal{L}_{\kappa}^{\rm max}$
  layers:
  - name: prof
    data:
    - source: df
      transform:
      - profile:
          bin: 100
          coordinates:
            x:
              expr: Lambda4
              scale: linear
              name: xx
              lim:
              - -1.5
              - 1.5
            y:
              expr: Lambda2
              scale: linear
              name: yy
              lim:
              - -1.5
              - 1.5
            z:
              expr: X2kappa
              scale: linear
              name: z0
          objective: min
          grid_points: rect
    share_data: pL2L4
    axes: ax
    method: voronoi
    coordinates:
      x:
        expr: xx
      y:
        expr: yy
      z:
        expr: np.exp(-2.0 * (X2kappa - np.min(X2kappa)))
    style:
      cmap: jarvis_rainbow2_r
      vmin: 0
      vmax: 1

