site_name: Jarvis-HEP Documentation
site_url: https://pengxuan-zhu-phys.github.io/Jarvis-Docs/

theme:
  name: material
  logo: assets/JarvisHEP.png
  favicon: assets/JarvisHEP.png
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.gm95.css

plugins:
  - search
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
validation:
  nav:
    omitted_files: ignore
nav:
  - Home: index.md
  - YAML Basics:
      - Practical YAML Introduction: yaml/yaml_introduction.md
  - Quick Start:
      - Installation: tutorial/Installation.md
      - First Scan (EggBox): tutorial/Common_workflow.md
      - Command Line Tools: tutorial/cli.md
      - First Module (EggBox): tutorial/eggbox.md
  - Jarvis-HEP:
      - Task YAML Structure: core/yaml_overview.md
      - Sampler Summary: core/samplers.md
      - Scan Parameters: core/variables.md
      - LogLikelihood: core/likelihood.md
      - Calculators: core/calculator.md
      - Library Dependencies: core/library.md
      - Operas: core/operas.md
      - Environment Requirements: core/environment.md
      - Symbolic Expressions: core/symbol.md
      - I/O Formats: core/io_summary.md
      - Utils: core/utils.md
      - Core CLI Reference: core/cli.md
  - Samplers:
      - Core Samplers: samplers/index.md
      - Nuisance Samplers: samplers/nuisance.md
  - Jarvis-PLOT:
      - Plotting Overview: jarvisplot/jarvisplot.md
      - Figure Gallery: jarvisplot/gallery.md
  - Jarvis-Operas:
      - Operas Overview: package/jarvis-operas.md
      - Function Catalog: package/functions.md
  - Research Examples:
      - Published Research Using Jarvis: examples/examples.md
